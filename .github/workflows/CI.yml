name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JULIA_PKG_PRECOMPILE_AUTO: "0"

jobs:
  integration:
    name: Julia ${{ matrix.version }} / ${{ matrix.dependency-set }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "1.10.12"
            dependency-set: minimum
          - version: "1.10.12"
            dependency-set: current
          - version: "1.12.7"
            dependency-set: minimum
          - version: "1.12.7"
            dependency-set: current
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v2
      - name: Run integration tests
        env:
          RISKLABAI_DEPENDENCY_SET: ${{ matrix.dependency-set }}
        run: |
          julia --startup-file=no -e '
            using Pkg
            Pkg.activate(; temp = true)
            Pkg.develop(path = pwd())
            if ENV["RISKLABAI_DEPENDENCY_SET"] == "minimum"
                Pkg.add([
                    Pkg.PackageSpec(name = "Clarabel", version = v"0.11.1"),
                    Pkg.PackageSpec(name = "Clustering", version = v"0.15.8"),
                    Pkg.PackageSpec(name = "Combinatorics", version = v"1.1.0"),
                    Pkg.PackageSpec(name = "CovarianceEstimation", version = v"0.2.13"),
                    Pkg.PackageSpec(name = "DataFrames", version = v"1.8.2"),
                    Pkg.PackageSpec(name = "DecisionTree", version = v"0.12.4"),
                    Pkg.PackageSpec(name = "Distributions", version = v"0.25.128"),
                    Pkg.PackageSpec(name = "HypothesisTests", version = v"0.11.8"),
                    Pkg.PackageSpec(name = "JuMP", version = v"1.32.1"),
                    Pkg.PackageSpec(name = "Lux", version = v"1.31.4"),
                    Pkg.PackageSpec(name = "Optim", version = v"2.3.2"),
                    Pkg.PackageSpec(name = "Optimisers", version = v"0.4.7"),
                    Pkg.PackageSpec(name = "QuadGK", version = v"2.11.3"),
                    Pkg.PackageSpec(name = "SpecialFunctions", version = v"2.8.0"),
                    Pkg.PackageSpec(name = "Zygote", version = v"0.7.11"),
                ])
            else
                Pkg.add([
                    Pkg.PackageSpec(name = "Clarabel"),
                    Pkg.PackageSpec(name = "Clustering"),
                    Pkg.PackageSpec(name = "Combinatorics"),
                    Pkg.PackageSpec(name = "CovarianceEstimation"),
                    Pkg.PackageSpec(name = "DataFrames"),
                    Pkg.PackageSpec(name = "DecisionTree"),
                    Pkg.PackageSpec(name = "Distributions"),
                    Pkg.PackageSpec(name = "HypothesisTests"),
                    Pkg.PackageSpec(name = "JuMP"),
                    Pkg.PackageSpec(name = "Lux"),
                    Pkg.PackageSpec(name = "Optim"),
                    Pkg.PackageSpec(name = "Optimisers"),
                    Pkg.PackageSpec(name = "QuadGK"),
                    Pkg.PackageSpec(name = "SpecialFunctions"),
                    Pkg.PackageSpec(name = "Zygote"),
                ])
            end
            using RiskLabAI
            include(joinpath(pwd(), "test", "runtests.jl"))
          '

  format:
    name: JuliaFormatter 2.9.0
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.12.7"
      - name: Verify deterministic formatting
        run: |
          julia --startup-file=no -e '
            using Pkg
            Pkg.activate(; temp = true)
            Pkg.add(PackageSpec(name = "JuliaFormatter", version = v"2.9.0"))
            using JuliaFormatter
            paths = [
                "src/CausalFactorAnalysis",
                "test/causal_factor_analysis",
                "test/runtests.jl",
            ]
            format(paths; overwrite = false, verbose = true) || exit(1)
          '
